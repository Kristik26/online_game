<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Párty Portál 🎮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. PŘIHLÁŠENÍ -->
    <div id="screen-login" class="screen active">
        <h1>🍻 Párty Portál</h1>
        <input type="text" id="playerName" placeholder="Tvoje přezdívka" maxlength="15" autocomplete="off">
        <input type="text" id="roomId" placeholder="Kód místnosti" maxlength="10" autocomplete="off">
        <button id="btnJoin" class="btn-primary">Vstoupit do místnosti</button>
    </div>

    <!-- 2. HLAVNÍ LOBBY (Rozcestník) -->
    <div id="screen-lobby" class="screen">
        <div class="header-bar">
            <span>Místnost: <strong id="displayRoomId"></strong></span>
            <span>Hráč: <strong id="displayPlayerName"></strong></span>
        </div>

        <h3>Kdo je v místnosti:</h3>
        <ul id="playersList" class="player-grid"></ul>

        <!-- Ovládání vidí jen zakladatel (Host) -->
        <div id="hostControls" class="host-panel" style="display: none;">
            <h3>Vyber hru pro všechny:</h3>
            <button class="btn-game" data-game="bomba">💣 Horký Brambor (Bomba)</button>
            <button class="btn-game" data-game="slider" style="background: #8b5cf6;">🎚️ Tref Průměr (Slider)</button>
            <button class="btn-game" data-game="vyzyvatel" style="background: #6366f1;">🧠 Vědomostní Výzva (Kvíz)</button>
            <button class="btn-game" data-game="dilema" style="background: #ec4899;">⚖️ Absolutní Dilema (Co bys radši?)</button>
            <button class="btn-game" data-game="kralove" style="background: #eab308; color: #000000;">👑 Králové (Karty & Pravidla)</button>
        </div>

        <p id="waitingMsg" class="pulse-text">Čeká se, až hostitel vybere hru...</p>

        <button id="btnLeaveRoom" class="btn-small" style="margin-top: 25px; background: #7f1d1d;">
            🚪 Opustit místnost
        </button>
    </div>

    <!-- 3. HRA: BOMBA -->
    <div id="screen-bomba" class="screen">
        <!-- Horní lišta pro návrat do lobby (vidí jen Host) -->
        <div class="host-only-bar" style="display: none;">
            <button class="btn-small btn-backToLobby">⬅ Zpět do výběru her</button>
        </div>

        <div id="bomba-content">
            <!-- Obsah hry Bomba se vykresluje dynamicky přes games/bomba.js -->
        </div>
    </div>

    <!-- 4. HRA: TREF PRŮMĚR (SLIDER) -->
    <div id="screen-slider" class="screen">
        <!-- Horní lišta pro návrat do lobby (vidí jen Host) -->
        <div class="host-only-bar" style="display: none;">
            <button class="btn-small btn-backToLobby">⬅ Zpět do výběru her</button>
        </div>

        <div id="slider-content">
            <!-- Obsah hry Slider se vykresluje dynamicky přes games/slider.js -->
        </div>
    </div>

    <!-- 5. HRA: VĚDOMOSTNÍ VÝZVA (VYZYVATEL) -->
    <div id="screen-vyzyvatel" class="screen">
        <!-- Horní lišta pro návrat do lobby (vidí jen Host) -->
        <div class="host-only-bar" style="display: none;">
            <button class="btn-small btn-backToLobby">⬅ Zpět do výběru her</button>
        </div>

        <div id="vyzyvatel-content">
            <!-- Obsah kvízu se vykresluje dynamicky přes games/vyzyvatel.js -->
        </div>
    </div>

    <!-- 6. HRA: ABSOLUTNÍ DILEMA -->
    <div id="screen-dilema" class="screen">
        <!-- Horní lišta pro návrat do lobby (vidí jen Host) -->
        <div class="host-only-bar" style="display: none;">
            <button class="btn-small btn-backToLobby">⬅ Zpět do výběru her</button>
        </div>

        <div id="dilema-content">
            <!-- Obsah hry Dilema se vykresluje dynamicky přes games/dilema.js -->
        </div>
    </div>

    <!-- 7. HRA: KRÁLOVÉ (PRAVIDLA) -->
    <div id="screen-kralove" class="screen">
        <!-- Horní lišta pro návrat do lobby (vidí jen Host) -->
        <div class="host-only-bar" style="display: none;">
            <button class="btn-small btn-backToLobby">⬅ Zpět do výběru her</button>
        </div>

        <div id="kralove-content">
            <!-- Obsah hry Králové se vykresluje dynamicky přes games/kralove.js -->
        </div>
    </div>

    <!-- Hlavní skript jako ES6 modul -->
    <script type="module" src="./app.js?v=7"></script>
</body>
</html>
